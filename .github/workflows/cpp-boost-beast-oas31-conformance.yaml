name: cpp-boost-beast OAS 3.1 conformance

on:
  schedule:
    # Nightly conformance sweep (real Gate A + Phase-2 + JSTS subset + repo hygiene).
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - 'plan/cpp-boost-beast-*'

jobs:
  cpp-boost-beast-oas31-conformance:
    name: cpp-boost-beast-oas31-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', 'modules/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Boost gates the C++ Phase-2 + JSTS steps: the generated C++ headers
      # depend on Boost.JSON / Boost.Beast. libboost-all-dev pulls in Boost.JSON
      # (Ubuntu 22.04+) as well as the header-only cores. Installed up front so
      # the Phase-2 runner and the JSTS subset runner (below) can compile.
      - name: Install C++ toolchain (Boost gates the C++ Phase-2 + JSTS steps)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev python3-yaml

      - name: Build cpp-boost-beast codegen tests
        shell: bash
        run: |
          ./mvnw -pl modules/openapi-generator -am -Dtest=CppBoostBeastClientCodegenTest,CppBoostBeastClientApiCodegenTest test

      - name: Syntax check Gate A harness script
        shell: bash
        run: |
          bash -n \
            modules/openapi-generator/src/test/resources/3_1/cpp-boost-beast-client/oas-compliance/gate-a.sh

      # ---------------------------------------------------------------------
      # Real Gate A — full pipeline (was inventory-only before). Builds the CLI
      # jar, generates from the composition fixtures, inventories composed
      # schemas (empty-shell + type-mismatch detection), runs the negative
      # fixtures, and — because Boost is installed on this runner — executes the
      # Wave-0 K-18 compiled raw-instance Phase-2 runner under -Werror. It
      # resolves every semantic row it can and re-classifies them PASS/FAIL with
      # real accept/reject evidence; rows it cannot cover stay honestly DEFERRED.
      #
      # Anti-greenwash: we surface the real __SEMANTIC_DEFERRED__= count and
      # claim GS4 ONLY when that count is 0. Otherwise the report admits the
      # shortfall; it never manufactures a pass.
      # ---------------------------------------------------------------------
      - name: Run Gate A — full pipeline + Phase-2 raw-instance runner (Boost)
        shell: bash
        run: |
          set -euo pipefail
          A=modules/openapi-generator/src/test/resources/3_1/cpp-boost-beast-client/oas-compliance
          log="$(mktemp)"
          # On the ubuntu runner Boost lives under /usr/include (apt libboost-all-dev).
          set +e
          BOOST_INCLUDE_DIR=/usr/include bash "${A}/gate-a.sh" 2>&1 | tee "${log}"
          rc=${PIPESTATUS[0]}
          set -e

          deferred=$(grep -o '__SEMANTIC_DEFERRED__=[0-9]*' "${log}" | head -1 | tr -cd '0-9' || true)
          phase2_total=$(grep -o '__PHASE2_TOTAL__=[0-9]*' "${log}" | head -1 | cut -d= -f2 || true)
          phase2_pass=$(grep -o '__PHASE2_PASS__=[0-9]*' "${log}" | head -1 | cut -d= -f2 || true)
          phase2_fail=$(grep -o '__PHASE2_FAIL__=[0-9]*' "${log}" | head -1 | cut -d= -f2 || true)
          : "${deferred:=UNKNOWN}"

          echo "::group::Gate A tail report"
          tail -45 "${log}"
          echo "::endgroup::"

          echo "Phase-2 raw-instance runner: ${phase2_total:-0} cases, ${phase2_pass:-0} PASS / ${phase2_fail:-0} FAIL."
          echo "__SEMANTIC_DEFERRED__=${deferred}"
          if [[ "${deferred}" == "0" ]]; then
            echo "GS4 status: MET — zero DEFERRED semantic rows (raw-instance surface fully resolved)."
          else
            echo "GS4 status: NOT met — ${deferred} semantic row(s) remain DEFERRED (honest; not claimed as GS4/pass)."
          fi

          # Persist the real evidence so the artifact upload below can keep it.
          cp "${A}/semantic-resolved.tsv" ./phase2-resolved.tsv 2>/dev/null || true
          cp "${A}/phase2-results.log" ./phase2-results.log 2>/dev/null || true
          rm -f "${log}"
          # Gate A's own exit code still gates the job (inventory / negative /
          # semantic-classification failures fail the job; DEFERRED rows do not).
          exit "${rc}"

      # ---------------------------------------------------------------------
      # Real invariant checker for the compliance matrix + JSTS exclusion
      # ledger (was a bare YAML-parse step before). Machine checks:
      #   * the matrix parses as a list and every row carries the documented
      #     contract fields;
      #   * no duplicate matrix keywords;
      #   * every required-vocabulary keyword from the plan (§3.1 Core,
      #     §3.2 Applicator, §3.3 Unevaluated, §3.4 Validation) has a matrix row;
      #   * no row is simultaneously 'supported' while its appendix
      #     (parser-blockers.md) row is 'Blocker';
      #   * every 'supported' row has non-empty source/parser/IR/runtime
      #     evidence;
      #   * the JSTS exclusion ledger still parses with a real 40-hex
      #     suiteCommit and a bounded, empty-or-optional-profile exclusions list.
      # Exits non-zero on the first invariant violation, printing each failing
      # row.
      # ---------------------------------------------------------------------
      - name: Validate compliance matrix + JSTS ledger invariants
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys, yaml

          root = "modules/openapi-generator/src/test/resources/3_1/cpp-boost-beast-client"
          compliance_matrix = f"{root}/compliance-matrix.yaml"
          jsts_exclusions   = f"{root}/oas31-jsts/jsts-exclusions.yaml"
          appendix          = "docs/cpp-boost-beast-client-parser-blockers.md"

          # Required-vocabulary keyword sets hardcoded from the plan
          # (CPP_BOOST_BEAST_OPENAPI_31_FULL_COMPLIANCE_PLAN.md §3.1-3.4) so the
          # check is reproducible without reading the plan at run time.
          REQUIRED = {
              "Core": ["$schema","$id","$ref","$defs","$anchor","$dynamicAnchor",
                       "$dynamicRef","$vocabulary","$comment","$recursiveRef",
                       "$recursiveAnchor"],
              "Applicator": ["allOf","anyOf","oneOf","not","if","then","else",
                             "properties","patternProperties","additionalProperties",
                             "propertyNames","dependentSchemas","prefixItems",
                             "items","contains"],
              "Unevaluated": ["unevaluatedProperties","unevaluatedItems"],
              "Validation": ["type","enum","const","multipleOf","maximum",
                             "exclusiveMaximum","minimum","exclusiveMinimum",
                             "maxLength","minLength","pattern","maxItems",
                             "minItems","uniqueItems","maxContains","minContains",
                             "maxProperties","minProperties","required",
                             "dependentRequired"],
          }
          CONTRACT = ["keyword","vocabularyUri","classification","profiles","status",
                      "acceptedSchemaDomain","sourceEvidence","parserEvidence",
                      "irEvidence","runtimeEvidence","jstsGroups","notes"]
          VALID_STATUS = {"supported","fail-closed","annotation","deferred"}
          EVIDENCE = ["sourceEvidence","parserEvidence","irEvidence","runtimeEvidence"]

          failures = []

          # ---- compliance matrix ----
          with open(compliance_matrix) as f:
              matrix = yaml.safe_load(f)
          if not isinstance(matrix, list):
              failures.append(f"{compliance_matrix}: must be a list, got {type(matrix).__name__}")
              matrix = []

          seen = {}
          for i, row in enumerate(matrix):
              if not isinstance(row, dict):
                  failures.append(f"row {i}: not a mapping ({type(row).__name__})")
                  continue
              kw = row.get("keyword")
              if not isinstance(kw, str) or not kw:
                  failures.append(f"row {i}: missing/invalid 'keyword'")
                  continue
              if kw in seen:
                  failures.append(f"duplicate matrix keyword {kw!r} (row {i} clashes with row {seen[kw]})")
              seen[kw] = i
              missing = [f for f in CONTRACT if f not in row]
              if missing:
                  failures.append(f"row {kw}: missing contract field(s) {missing}")
              if row.get("status") not in VALID_STATUS:
                  failures.append(f"row {kw}: unknown status {row.get('status')!r} (valid: {sorted(VALID_STATUS)})")
              if row.get("status") == "supported":
                  for ef in EVIDENCE:
                      v = row.get(ef)
                      if not (isinstance(v, str) and v.strip()):
                          failures.append(f"row {kw}: status 'supported' but {ef} is empty")

          matrix_kws = {r.get("keyword") for r in matrix if isinstance(r, dict)}
          for vocab, kws in REQUIRED.items():
              for kw in kws:
                  if kw not in matrix_kws:
                      failures.append(f"missing required {vocab} keyword {kw!r} in matrix")

          # no 'supported' row whose appendix row is 'Blocker'
          if os.path.exists(appendix):
              blocker = set()
              with open(appendix) as f:
                  for line in f:
                      if "**Blocker**" in line:
                          m = re.search(r"\|\s*`([^`]+)`", line)
                          if m:
                              blocker.add(m.group(1))
              for row in matrix:
                  if row.get("status") == "supported" and row.get("keyword") in blocker:
                      failures.append(f"row {row.get('keyword')}: status 'supported' but appendix marks it 'Blocker'")
          else:
              failures.append(f"appendix not found: {appendix}")

          # ---- JSTS exclusion ledger ----
          with open(jsts_exclusions) as f:
              jsts = yaml.safe_load(f)
          if not isinstance(jsts, dict):
              failures.append(f"{jsts_exclusions}: must be a mapping, got {type(jsts).__name__}")
          else:
              sc = jsts.get("suiteCommit", "")
              if not (isinstance(sc, str) and re.fullmatch(r"[0-9a-f]{40}", sc)):
                  failures.append(f"suiteCommit must be a 40-char hex SHA, got {sc!r}")
              if not isinstance(jsts.get("exclusions", []), list):
                  failures.append(f"{jsts_exclusions}: 'exclusions' must be a list")
              for e in jsts.get("exclusions", []):
                  if not (isinstance(e, dict) and e.get("classification") == "optional-profile"):
                      failures.append(f"exclusion entry must be 'optional-profile': {e!r}")
              if jsts.get("exclusions"):
                  failures.append("JSTS exclusions ledger is non-empty (required-vocab exclusions must be zero)")

          if failures:
              print(f"INVARIANT FAIL ({len(failures)}):")
              for f in failures:
                  print("  - " + f)
              sys.exit(1)
          print(f"OK: {len(matrix)} matrix rows + JSTS ledger pass all invariants "
                f"({sum(1 for r in matrix if r.get('status')=='supported')} supported rows all-with-evidence).")
          PY

      # ---------------------------------------------------------------------
      # JSTS — FULL pinned 2020-12 corpus via the Boost-gated
      # generate/compile/run pipeline (Wave-6 promotion: the runner now
      # completes the full 46-file suite in the batch mode that matches the
      # local evidence; the old representative-subset step was replaced).
      #
      # Honesty rules: PASS/FAIL/BLOCKED are the raw runner numbers (BLOCKED =
      # no production model / generation shortfall / compile shortfall; FAIL =
      # genuine required-vocabulary shortfall). GS2/GS3 are claimed only when
      # the gate script reports every test PASS with FAIL == 0 and BLOCKED == 0.
      # ---------------------------------------------------------------------
      - name: JSTS — full pinned 2020-12 corpus via Boost-gated runner
        shell: bash
        run: |
          set -euo pipefail
          J=modules/openapi-generator/src/test/resources/3_1/cpp-boost-beast-client/oas31-jsts
          JAR=modules/openapi-generator-cli/target/openapi-generator-cli.jar
          mkdir -p tmp/jsts-work tmp/jsts-reports

          # 1. Vendor the pinned suite (reads suiteCommit from jsts-exclusions.yaml).
          bash "${J}/tools/vendor.sh" "${J}/vendor"

          # 2. Full corpus: every draft2020-12 test file (default of the
          #    slice runner; same set as the local evidence runs).
          python3 "${J}/tools/jsts_genpath_slice.py" --suite "${J}/vendor" \
            --jar "${JAR}" --work tmp/jsts-work \
            --out tmp/jsts-reports/jsts-report.json --workers 6
          echo "::group::JSTS full-corpus totals"
          python3 -c 'import json; t=json.load(open("tmp/jsts-reports/jsts-report.json"))["totals"]; print(f"files={t[\"files\"]} cases={t[\"cases\"]} PASS={t[\"PASS\"]} FAIL={t[\"FAIL\"]} BLOCKED={t[\"BLOCKED\"]}")'
          echo "::endgroup::"
          echo "GS2 status: claimed only when PASS==total and FAIL==0 and BLOCKED==0."

      # ---------------------------------------------------------------------
      # Wave-5 C-profile wire gate: the six golden matrices run the generated
      # client against (a) recording clients asserting exact wire bytes and
      # (b) a REAL boost::beast loopback HTTP server through the real
      # HttpClientImpl. Failures fail the job — this is the C-profile
      # contract surface (parameter styles, servers+variables, security
      # hooks, requestBody/media types, non-schema refs, callbacks/webhooks/
      # links metadata, runtime mock HTTP).
      # ---------------------------------------------------------------------
      - name: C-profile wire gate — 6 golden matrices incl. runtime mock HTTP
        shell: bash
        run: |
          set -euo pipefail
          J=modules/openapi-generator/src/test/resources/3_1/cpp-boost-beast-client/oas31-jsts
          JAR=modules/openapi-generator-cli/target/openapi-generator-cli.jar
          set +e
          OMP_JSTS_SSL_LIB=/usr/lib/x86_64-linux-gnu/libssl.a \
          OMP_JSTS_CRYPTO_LIB=/usr/lib/x86_64-linux-gnu/libcrypto.a \
            python3 "${J}/tools/jsts_param_wire.py" 2>&1 \
            | tee tmp/jsts-reports/wire-gate.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "::group::wire-gate totals"
          grep -E 'PASS$|cells, [0-9]+ PASS' tmp/jsts-reports/wire-gate.log || true
          echo "::endgroup::"
          exit "${rc}"

      # ---------------------------------------------------------------------
      # Sample regen + hardening compile: regenerate the committed petstore
      # sample from the current generator and compile EVERY emitted TU under
      # -Wall -Wextra -Werror (warnings are errors; the audit gate).
      # ---------------------------------------------------------------------
      - name: Sample regen + hardening compile (-Wall -Wextra -Werror)
        shell: bash
        run: |
          set -euo pipefail
          bash bin/generate-samples.sh bin/configs/cpp-boost-beast-client-petstore.yaml
          git diff --stat samples/client/petstore/cpp-boost-beast > tmp/jsts-reports/sample-diff.stat
          g++ -std=c++17 -O1 -Wall -Wextra -Werror \
            -Isamples/client/petstore/cpp-boost-beast/generated \
            -Isamples/client/petstore/cpp-boost-beast/generated/api \
            -Isamples/client/petstore/cpp-boost-beast/generated/model \
            -I/usr/include \
            -c samples/client/petstore/cpp-boost-beast/generated/api/PetApi.cpp \
            -o /tmp/petapi.o
          echo "Sample hardening compile: PASS"

      # ---------------------------------------------------------------------
      # M profile gate (GM1/GM2): the five-class mapping corpus runs the
      # GENERATED model axis through the compiled M driver (transport /
      # schema-invalid / unrepresentable / representable / narrowed).  Every
      # representation failure must classify as representation, never as
      # schema validity.  Failures fail the job.
      # ---------------------------------------------------------------------
      - name: M profile gate — five-class mapping corpus (50 rows)
        shell: bash
        run: |
          set -euo pipefail
          J=modules/openapi-generator/src/test/resources/3_1/cpp-boost-beast-client/oas31-jsts
          C=modules/openapi-generator/src/test/resources/3_1/cpp-boost-beast-client/oas-compliance
          JAR=modules/openapi-generator-cli/target/openapi-generator-cli.jar
          W=tmp/m-gate
          rm -rf "${W}" && mkdir -p "${W}"
          java -jar "${JAR}" generate -g cpp-boost-beast-client \
            -i "${J}/mprofile/m-probe-schemas.yaml" -o "${W}/gen" \
            --additional-properties packageName=CppBoostBeastMProbe,apiPackage=api,modelPackage=model
          printf '#include <boost/json/src.hpp>\n' > "${W}/boost_json_src.cpp"
          PHASE2_M_INC="${W}/phase2_m.inc" M_CORPUS="${J}/mprofile/m-corpus.yaml" \
            python3 "${C}/phase2_m_gen.py" "${W}"
          g++ -std=c++17 -O1 -Wall -Wextra -Werror \
            -I"${W}" -I"${W}/gen" -I"${W}/gen/model" -I/usr/include \
            "${C}/m_driver.cpp" "${W}/boost_json_src.cpp" \
            "${W}"/gen/model/Int32Box.cpp "${W}"/gen/model/Int64Box.cpp \
            "${W}"/gen/model/FloatBox.cpp "${W}"/gen/model/DoubleBox.cpp \
            "${W}"/gen/model/StringBox.cpp "${W}"/gen/model/BoolBox.cpp \
            "${W}"/gen/model/EnumBox.cpp "${W}"/gen/model/NullableBox.cpp \
            "${W}"/gen/model/PolyBox.cpp "${W}"/gen/model/Cat.cpp \
            "${W}"/gen/model/Dog.cpp "${W}"/gen/model/CollectionBox.cpp \
            "${W}"/gen/model/Child.cpp \
            -o "${W}/m_driver" && "${W}/m_driver" "${W}/m-resolved.tsv" \
            | tee tmp/jsts-reports/m-gate.log
          python3 -c 'import json,sys; t=[l for l in open("tmp/jsts-reports/m-gate.log") if "__M_PASS__" in l][-1]; print(t.strip())'

      - name: Upload conformance report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-boost-beast-oas31-conformance
          path: |
            tmp/jsts-reports/jsts-report.json
            tmp/jsts-reports/wire-gate.log
            tmp/jsts-reports/m-gate.log
            tmp/jsts-reports/sample-diff.stat
            phase2-resolved.tsv
            phase2-results.log
          if-no-files-found: ignore
