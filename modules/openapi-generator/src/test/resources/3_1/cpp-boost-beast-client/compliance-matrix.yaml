# =============================================================================
# cpp-boost-beast-client — OAS 3.1 / JSON Schema 2020-12 Compliance Matrix
# =============================================================================
# Wave 0 machine-readable keyword ledger ("Wave 0 item 1" of
# CPP_BOOST_BEAST_OPENAPI_31_FULL_COMPLIANCE_PLAN.md).
#
# Important honesty rule: this is a WAVE-0 matrix. Status values reflect the
# CURRENT generator state after remediation (phases 0–10) plus the Wave-0
# compiled raw-instance Phase-2 runner evidence. It documents G-honest (zero
# silent ignore) coverage and the fail-closed surface. It does NOT yet claim
# G-full-schema. The Phase-2 compiled raw-instance runner (Boost-gated, Wave 0
# K-18) has landed and produced real accept/reject evidence for the currently
# `supported` composition/validation keywords (see `runtimeEvidence` rows
# citing oas-compliance/semantic-results.tsv). GS4 'zero DEFERRED' is NOT met:
# 19 semantic rows remain DEFERRED. Achieving G-full-schema additionally
# requires the Wave 1–4 implementation waves; until then any keyword whose
# exact mathematical/Unicode/evaluation semantics are not proven must stay
# `fail-closed` rather than `supported`.
#
# Reclassification (GS1/GS2 runtime-only rule): `supported` is now granted ONLY
# to keywords with real RUNTIME evidence (a JSTS required-vocabulary group
# passing, or a compiled raw-instance accept/reject proof from
# oas-compliance/semantic-results.tsv). source/parser/IR evidence alone do NOT
# qualify. The 15 keywords whose validators are emitted (source+IR) but which
# have no runtime proof yet ($ref, properties, items, const, maximum,
# exclusiveMaximum, minimum, exclusiveMinimum, maxLength, minLength, pattern,
# maxItems, minItems, uniqueItems, required) are therefore marked `deferred`
# (runtime-unproven), NOT `fail-closed` (they do not refuse generation) and NOT
# `supported` (no runtime evidence). They become claimable as `supported` only
# when a JSTS group or compiled raw-instance proof lands.
#
# Wave-1 generated-path update (committed, real): the generated-path numeric/
# boolean integration gate (`oas-compliance/gate-generated-path.sh`, 39/39) and
# the committed JSTS numeric/boolean GENERATED-path subset report
# (`oas31-jsts/wave1-numeric-subset-report.md`, 10 files / 281 cases through the
# real generator's validate_<id> dispatch) now carry real per-keyword runtime
# evidence. Wave-1 COMPLETE update (committed `oas31-jsts/wave1-complete-subset-
# report.md`, HEAD 36c11de5 GENERATED-path run): Per-file (PASS/FAIL/BLOCKED):
# boolean_schema 18/0/0, const 54/0/0 (both SUPPORTED); not 36/4/0, enum 46/5/0,
# uniqueItems 28/0/41, ref 6/5/68 (311 cases total). Because promotion requires
# the JSTS group zero-FAIL and zero-BLOCKED, boolean_schema and const are `supported`
# (real runtime evidence); not/enum remain `deferred` (residual FAIL even
# though zero-BLOCKED); uniqueItems and $ref remain `deferred` (BLOCKED /
# partial). Wave-2 STRUCTURAL update (committed `oas31-jsts/wave2-structural-
# subset-report.md`, 082461df8f5 + engine 1a1e8c28, 13 files / 378 cases GENERATED
# path: 361 PASS / 7 FAIL / 10 BLOCKED): uniqueItems 69/0/0, required 18/0/0,
# prefixItems 11/0/0, items 29/0/0 -> all four SUPPORTED (zero-FAIL AND
# zero-BLOCKED). not 39/1/0, enum 50/1/0, ref 78/1/0, properties 26/2/0 remain
# `deferred` (zero-BLOCKED but residual semantic FAILs; see per-row notes).
# additionalProperties 17/2/2 and min/maxProperties, min/maxItems (0 FAIL but 2
# BLOCKED each, schema-side decimal-bound emission gap) remain `deferred`.
# Numeric rows (minimum/maximum/exclusive*/multipleOf `supported`, type
# `deferred`) are unchanged from the numeric-subset report, which owns
# those rows and is NOT re-measured here. No row is `supported` without real
# GENERATED-path or Phase-2 runtime evidence.
#
# Row contract (plan §8.1): keyword, vocabularyUri, classification, profiles,
# status, acceptedSchemaDomain, sourceEvidence, parserEvidence, irEvidence,
# runtimeEvidence, jstsGroups, notes. CI rejects duplicate/missing manifest
# keywords, unknown statuses, missing evidence for `supported`, and
# generated-documentation drift.
#
# Status vocabulary:
#   supported    — validated by generated validator / model emission (S-V) or
#                  preserved & exposed (S-A). Evidence required.
#                  EXACT-MATH / UNICODE caveats are called out per row because
#                  they block the G-full-schema claim until the exact-number
#                  layer and ECMA-262 pattern engine land.
#   fail-closed  — recognised as validity-affecting but not implemented; the
#                  generator refuses to emit rather than silently mis-validate.
#                  This is G-honest, NOT full support.
#   annotation   — collected/preserved/exposed with no validity effect (S-A).
#   deferred     — recognised; implementation scheduled in a later wave.
#
# Evidence IDs are repo paths or test names (commit-hash evidence is recorded
# in jsts-exclusions.yaml / the parser-blockers appendix).

