# =============================================================================
# Semantic Case Manifest — OAS Gate A
# =============================================================================
# Every acceptance-matrix row mapped to a specific schema or operation,
# one or more JSON payloads, and the expected outcome class.
#
# Outcome classes:
#   generation_failure — generator must exit non-zero or not produce header
#   compile_failure   — generated C++ fails warning-as-error build
#   decode_accept     — payload decodes against the schema without error
#   decode_reject     — payload produces a decode/validation error
#   round_trip        — serialize(deserialize(payload)) == original payload
#
# Format:
#   - id: <unique-label>
#     schema: <component-schema-name>
#     operationId: <operation-id>
#     cases:
#       - payload: <JSON value or response object>
#         expected: <outcome-class>
#         branch: <optional branch index for accepted cases>
#         note: <row description>

- id: oneof-constrained-numbers-reject-zero
  schema: ConstrainedNumber
  operationId: postConstrainedNumber
  cases:
    - payload: 2
      expected: decode_reject
      note: "multipleOf:3 vs multipleOf:5, value 2 — zero matches"

- id: oneof-constrained-numbers-accept-branch0
  schema: ConstrainedNumber
  operationId: postConstrainedNumber
  cases:
    - payload: 9
      expected: decode_accept
      branch: 0
      note: "multipleOf:3 vs multipleOf:5, value 9 — accept branch 0"

- id: oneof-constrained-numbers-reject-two
  schema: ConstrainedNumber
  operationId: postConstrainedNumber
  cases:
    - payload: 15
      expected: decode_reject
      note: "multipleOf:3 vs multipleOf:5, value 15 — two matches"

