- id: range-default-exact-precedence
  note: "exact 200 + 2XX + default — exact takes precedence"
  spec: fixtures.yaml
  cases:
    - response: { status: 200, body: '"exact"' }
      expected: decode_accept
      branch: "200"
    - response: { status: 202, body: '"accepted"' }
      expected: decode_accept
      branch: "2XX"
    - response: { status: 301, body: '"fallback"' }
      expected: decode_accept
      branch: "default"

- id: multipart-encoding-explicit-content-type
  note: "multipart with explicit image/png encoding"
  spec: multipart-encoding-regression.yaml
  expected: decode_accept
  # Current generator loses encoding metadata; compiled C++ compiles but
  # does not emit the expected Content-Type header on the wire.  This is
  # a wire-level gap, not a compile failure.  Lock until C-08 is
  # implemented (then assertTrue in Java test).

- id: multipart-default-binary-no-encoding
  note: "multipart binary without encoding metadata — emit specification default"
  spec: fixtures.yaml
  operationId: uploadMultipartNoEncoding
  expected: decode_accept
  # Same generator gap as explicit-content-type.

- id: sse-strict-mode
  note: "SSE without event-data extension — expose framed event contract"
  schema: Evt
  spec: pure-sse-object.yaml
  cases:
    - payload: '{"msg":"hello"}'
      expected: decode_accept
      note: "strict SSE event object with msg field"

- id: sse-typed-mode
  schema: ResponseStreamEvent
  spec: composed-schema-lowering.yaml
  cases:
    - payload: '{"type":"response.created","id":"req-1"}'
      expected: decode_accept
      branch: "response.created"
      note: "typed SSE event — discriminator key type maps to ResponseCreatedEvent"
    - payload: '{"type":"response.completed","id":"req-1"}'
      expected: decode_accept
      branch: "response.completed"
      note: "typed SSE event — discriminator key type maps to ResponseCompletedEvent"

