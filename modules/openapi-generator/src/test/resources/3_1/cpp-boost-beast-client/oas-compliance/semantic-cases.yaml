      expected: decode_accept
      branch: "200"
    - response: { status: 202, body: '"accepted"' }
      expected: decode_accept
      branch: "2XX"
    - response: { status: 301, body: '"fallback"' }
      expected: decode_accept
      branch: "default"

- id: multipart-encoding-explicit-content-type
  note: "multipart with explicit image/png encoding"
  spec: multipart-encoding-regression.yaml
  expected: decode_accept
