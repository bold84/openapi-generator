- id: sse-typed-mode
  schema: ResponseStreamEvent
  spec: composed-schema-lowering.yaml
  cases:
    - payload: '{"type":"response.created","id":"req-1"}'
      expected: decode_accept
      branch: "response.created"
      note: "typed SSE event — discriminator key type maps to ResponseCreatedEvent"
    - payload: '{"type":"response.completed","id":"req-1"}'
      expected: decode_accept
      branch: "response.completed"
      note: "typed SSE event — discriminator key type maps to ResponseCompletedEvent"

- id: allof-scalar-conflict
  schema: AllOfScalarConflict
  note: "allOf [string, integer] — true scalar conflict"
  expected: generation_failure

- id: oneof-string-string-enum-overlap
  schema: OneOfStringStringEnum
  operationId: setLabel
  cases:
    - payload: '"x"'
      expected: decode_reject
      note: "oneOf [string, string-enum[x,y,z]] — value x matches both branches"

# =============================================================================
# Wave-1 numeric/boolean slice (SchemeEvaluator + ExactNumber + raw lexeme)
# =============================================================================
# These rows exercise the shared Wave-1 engine (ADR D1/D5, frozen IR in
# oas31_ir.hpp) through the compiled phase2_numeric_driver: it captures the raw
# JSON number LEXEME straight from the payload (before boost::json changes it),
# feeds it to ExactNumber, and evaluates via validate_<id> -> SchemaEvaluator.
# There are no Wave-0 model headers for these schema names; they are proven
# exclusively by that driver.  Baseline classification DEFERS them; the driver
# turns them into real PASS evidence (see phase2_classify.py / gate-a.sh).

- id: exact-equals-one
  schema: ExactEqualsOne
  note: "const:1 — 1 == 1.0 == 1e0 == 100e-2 (ExactNumber equality across spellings)"
  cases:
    - payload: "1"
      expected: decode_accept
    - payload: "1.0"
      expected: decode_accept
    - payload: "1e0"
      expected: decode_accept
    - payload: "100e-2"
      expected: decode_accept
    - payload: "2"
      expected: decode_reject

- id: exact-integer-type
  schema: ExactIntegerType
  note: "type:integer — classification by mathematical value, not spelling (1.0 is an integer)"
  cases:
    - payload: "1"
      expected: decode_accept
    - payload: "1.0"
      expected: decode_accept
    - payload: "-3.0"
      expected: decode_accept
    - payload: "1.5"
      expected: decode_reject

- id: mult-tenth
  schema: MulTenth
  note: "multipleOf:0.1 — exact decimal divmod (0.3/0.1 == 3, remainder 0)"
  cases:
    - payload: "0.3"
      expected: decode_accept
    - payload: "0.7"
      expected: decode_accept
    - payload: "0.25"
      expected: decode_reject

- id: mult-third
  schema: MulThird
  note: "multipleOf:0.3 — 1.0 is NOT a multiple of 0.3 (10/3 remainder 1)"
  cases:
    - payload: "0.9"
      expected: decode_accept
    - payload: "1.0"
      expected: decode_reject

- id: zero-const
  schema: ZeroConst
  note: "const:0 — negative zero is mathematically 0 (-0 == 0 == 0.0)"
  cases:
    - payload: "-0"
      expected: decode_accept
    - payload: "0"
      expected: decode_accept
    - payload: "0.0"
      expected: decode_accept
    - payload: "1"
      expected: decode_reject

- id: big-const-exact
  schema: BigConst
  note: "const:2^70 (1180591620717411303424) — beyond uint64; boost.json stores a lossy double but the lexeme keeps it exact (refuses to silently approximate)"
  cases:
    - payload: "1180591620717411303424"
      expected: decode_accept
    - payload: "1180591620717411303425"
      expected: decode_reject

- id: huge-max-exact
  schema: HugeMax
  note: "exclusiveMaximum:1e300 — very large exponent; boost.json yields inf, ExactNumber is exact"
  cases:
    - payload: "1e400"
      expected: decode_reject
    - payload: "5e299"
      expected: decode_accept

- id: tiny-min-exact
  schema: TinyMin
  note: "exclusiveMinimum:1e-300 — tiny exponent; boost.json underflows to 0, ExactNumber is exact"
  cases:
    - payload: "1e-400"
      expected: decode_reject
    - payload: "5e-200"
      expected: decode_accept

- id: nonpos-multiple-refusal
  schema: NonPosMul
  note: "multipleOf:0 — malformed schema (not > 0); evaluator REFUSES (fail closed), never a bogus verdict"
  cases:
    - payload: "5"
      expected: decode_reject
    - payload: "0"
      expected: decode_reject

- id: bool-const-true
  schema: BoolConstTrue
  note: "const:true — boolean const"
  cases:
    - payload: "true"
      expected: decode_accept
    - payload: "false"
      expected: decode_reject

- id: bool-enum-true
  schema: BoolEnumTrue
  note: "enum [true] — boolean enum"
  cases:
    - payload: "true"
      expected: decode_accept
    - payload: "false"
      expected: decode_reject
    - payload: "null"
      expected: decode_reject

- id: number-enum-spellings
  schema: NumberEnumSpellings
  note: "enum [1, 2.5] — numeric enum equality across spellings (1.0, 2.50)"
  cases:
    - payload: "1"
      expected: decode_accept
    - payload: "1.0"
      expected: decode_accept
    - payload: "2.50"
      expected: decode_accept
    - payload: "3"
      expected: decode_reject

# =============================================================================
# Wave-1 completion slice (gate-a Phase-2 driver) — boolean value-schemas
# (K-03), `not` subschema inversion (K-01), exact deep JSON const/enum equality
# across ALL kinds incl. 1 vs 1.0 (K-30/K-34), array uniqueItems with exact
# numeric equality (K-22), and local $ref resolution (K-29).  These schema names
# have NO Wave-0 model headers; they are proven exclusively by the compiled
# phase2_numeric_driver through validate_<id> -> SchemaEvaluator.  Baseline
# classification DEFERS them; driver evidence flips them to real PASS
# (see phase2_classify.py / gate-a.sh Step 4c).
# =============================================================================

- id: boolean-value-schema-true
  schema: BooleanValueTrue
  note: "K-03 OAS 3.1 boolean value-schema true — every instance is valid"
  cases:
    - payload: "true"
      expected: decode_accept
    - payload: "false"
      expected: decode_accept
    - payload: "42"
      expected: decode_accept
    - payload: '"hello"'
      expected: decode_accept
    - payload: "null"
      expected: decode_accept

- id: boolean-value-schema-false
  schema: BooleanValueFalse
  note: "K-03 OAS 3.1 boolean value-schema false — no instance is valid (reject)"
  cases:
    - payload: "true"
      expected: decode_reject
    - payload: "false"
      expected: decode_reject
    - payload: "42"
      expected: decode_reject
    - payload: "null"
      expected: decode_reject

- id: not-const-zero
  schema: NotConstZero
  note: "K-01 { not: { const: 0 } } — 0 is negated-rejected, any other value accepted"
  cases:
    - payload: "0"
      expected: decode_reject
    - payload: "1"
      expected: decode_accept
    - payload: "-3"
      expected: decode_accept
    - payload: '"x"'
      expected: decode_accept

- id: not-type-string
  schema: NotTypeString
  note: "K-01 { not: { type: string } } — strings negated-rejected, non-strings accepted"
  cases:
    - payload: '"hi"'
      expected: decode_reject
    - payload: "42"
      expected: decode_accept
    - payload: "true"
      expected: decode_accept

- id: deep-const-object
  schema: DeepConstObject
  note: "K-30 const:{a:1,b:[true,null]} — exact deep equality over object/array; a=1.0 == a=1"
  cases:
    - payload: '{"a":1,"b":[true,null]}'
      expected: decode_accept
    - payload: '{"a":1.0,"b":[true,null]}'
      expected: decode_accept
    - payload: '{"a":2,"b":[true,null]}'
      expected: decode_reject
    - payload: '{"a":1}'
      expected: decode_reject

- id: deep-const-array
  schema: DeepConstArray
  note: "K-30 const:[1,2,3] — exact deep equality over array; 1.0 == 1 member"
  cases:
    - payload: '[1,2,3]'
      expected: decode_accept
    - payload: '[1.0,2,3]'
      expected: decode_accept
    - payload: '[1,2,4]'
      expected: decode_reject

- id: deep-enum-objects
  schema: DeepEnumObjects
  note: "K-34 enum:[{a:1},{b:x}] — exact deep equality over object-values; a=1.0 == a=1"
  cases:
    - payload: '{"a":1}'
      expected: decode_accept
    - payload: '{"a":1.0}'
      expected: decode_accept
    - payload: '{"c":9}'
      expected: decode_reject

- id: unique-items-exact-number
  schema: UniqueItemsMixed
  note: "K-22 uniqueItems:true over array — 1 == 1.0 is a duplicate (ExactNumber)"
  cases:
    - payload: '[1,2]'
      expected: decode_accept
    - payload: '[1,2,3]'
      expected: decode_accept
    - payload: '[1,1.0]'
      expected: decode_reject
    - payload: '[1,2,1.0]'
      expected: decode_reject

- id: ref-const-five
  schema: RefConstFive
  note: "K-29 local $ref -> const:5 node — resolves target transparently (5 accept, 6 reject)"
  cases:
    - payload: "5"
      expected: decode_accept
    - payload: "6"
      expected: decode_reject
    - payload: "5.0"
      expected: decode_accept

# =============================================================================
# Wave-2 object/array structural slice (gate-a Phase-2 driver) — properties /
# required / additionalProperties tri-state / min-maxProperties / prefixItems /
# items remainder / min-maxItems / deep not into properties / enum with object
# + string members / uniqueItems true+false with container-depth exactness /
# local $defs $ref.  These map to the exact JSTS FAIL/BLOCKED rows of the
# Wave-1 COMPLETE report (not.json G2,G3 · enum.json G3,G14 ·
# uniqueItems.json G0,G1,G2,G3,G4 · ref.json G7,G14).  The schema names have NO
# Wave-0 model headers; they are proven exclusively by the compiled
# phase2_numeric_driver through validate_<id> -> SchemaEvaluator (baseline
# DEFERRED, flipped to real PASS only with on-disk evidence).
# =============================================================================

- id: object-props-required-enums
  schema: ObjectPropsRequired
  note: "enum.json G3 'enums in properties' — per-property enum + required enforced; the 4-FAIL group"
  cases:
    - payload: '{"foo":"foo","bar":"bar"}'
      expected: decode_accept
    - payload: '{"foo":"foot","bar":"bar"}'
      expected: decode_reject
    - payload: '{"foo":"foo","bar":"bart"}'
      expected: decode_reject
    - payload: '{"bar":"bar"}'
      expected: decode_accept
    - payload: '{"foo":"foo"}'
      expected: decode_reject
    - payload: '{}'
      expected: decode_reject

- id: object-additional-allowed
  schema: ObjectAdditionalAllowed
  note: "additionalProperties:true — unlisted keys are always allowed (no constraint)"
  cases:
    - payload: '{"a":1}'
      expected: decode_accept
    - payload: '{"a":1,"b":2}'
      expected: decode_accept
    - payload: '{"b":"x"}'
      expected: decode_accept
    - payload: '{"a":"x"}'
      expected: decode_reject

- id: object-additional-false
  schema: ObjectAdditionalFalse
  note: "additionalProperties:false — any unlisted key rejects; listed properties are never additionally evaluated"
  cases:
    - payload: '{"a":1}'
      expected: decode_accept
    - payload: '{"a":1,"b":2}'
      expected: decode_reject
    - payload: '{}'
      expected: decode_accept

- id: object-additional-schema
  schema: ObjectAdditionalSchema
  note: "additionalProperties:<schema> — unlisted values validated against the subschema (b must be a string)"
  cases:
    - payload: '{"a":1,"b":"x"}'
      expected: decode_accept
    - payload: '{"b":"x"}'
      expected: decode_accept
    - payload: '{"a":1,"b":2}'
      expected: decode_reject

- id: object-min-properties
  schema: ObjectMinProperties
  note: "minProperties:2.0 — decimal bound exact (2.0 == 2 via ExactNumber); 1-property and empty objects reject"
  cases:
    - payload: '{"a":1,"b":2}'
      expected: decode_accept
    - payload: '{"a":1}'
      expected: decode_reject
    - payload: '{}'
      expected: decode_reject

- id: object-max-properties
  schema: ObjectMaxProperties
  note: "maxProperties:2 — 3-property object rejects"
  cases:
    - payload: '{"a":1,"b":2}'
      expected: decode_accept
    - payload: '{"a":1,"b":2,"c":3}'
      expected: decode_reject

- id: object-required-addfalse
  schema: ObjectReqAddFalse
  note: "required + additionalProperties:false — missing id rejects; extra key rejects"
  cases:
    - payload: '{"id":1}'
      expected: decode_accept
    - payload: '{"id":1,"extra":2}'
      expected: decode_reject
    - payload: '{"extra":2}'
      expected: decode_reject
    - payload: '{}'
      expected: decode_reject

- id: ref-property-name
  schema: RefPropertyName
  note: "ref.json G7 'property named $ref' — literal property name, NOT a reference; type: string enforced"
  cases:
    - payload: '{"$ref":"a"}'
      expected: decode_accept
    - payload: '{"$ref":2}'
      expected: decode_reject

- id: enum-empty-reject-all
  schema: EnumEmptyRejectAll
  note: "enum.json G14 'empty enum' — enum:[] rejects every value of any kind"
  cases:
    - payload: '"foo"'
      expected: decode_reject
    - payload: '42'
      expected: decode_reject
    - payload: 'null'
      expected: decode_reject
    - payload: '{}'
      expected: decode_reject
    - payload: '[]'
      expected: decode_reject
    - payload: 'false'
      expected: decode_reject

- id: enum-ref-literal
  schema: EnumRefLiteral
  note: "ref.json G14 — the $ref inside an enum member is NOT evaluated; the literal object IS the member"
  cases:
    - payload: '"this is a string"'
      expected: decode_reject
    - payload: '{"$ref":"#/$defs/a_string"}'
      expected: decode_accept

- id: ref-siblings-apply
  schema: RefWithSibling
  note: "2020-12: $ref AND sibling keywords BOTH apply — ref->number so 1.5 satisfies the target, the integer sibling rejects it"
  cases:
    - payload: '1'
      expected: decode_accept
    - payload: '1.5'
      expected: decode_reject
    - payload: '"x"'
      expected: decode_reject

- id: not-complex-object
  schema: NotComplexRoot
  note: "not.json G2 'not more complex schema' — {not:{type:object,properties:{foo:{type:string}}}} inverted for non-object data and wrong-typed member"
  cases:
    - payload: '1'
      expected: decode_accept
    - payload: '{"foo":1}'
      expected: decode_accept
    - payload: '{"foo":"bar"}'
      expected: decode_reject

- id: not-empty-object-in-properties
  schema: ObjectPropNotAllowed
  note: "not.json G3 'forbidden property' — not:{} on a declared property rejects any present value; absent property is fine"
  cases:
    - payload: '{"foo":1,"bar":2}'
      expected: decode_reject
    - payload: '{"bar":1,"baz":2}'
      expected: decode_accept

- id: not-property-number
  schema: NotPropertyNumber
  note: "deep not into properties — {properties:{id:{not:{type:number}}}} — numbers reject, non-numbers accept"
  cases:
    - payload: '{"id":"x"}'
      expected: decode_accept
    - payload: '{"id":5}'
      expected: decode_reject
    - payload: '{}'
      expected: decode_accept

- id: object-defs-ref
  schema: ObjectDefsRef
  note: "local $defs $ref — property a -> $ref to a positive-number $def, required; negative rejects"
  cases:
    - payload: '{"a":5}'
      expected: decode_accept
    - payload: '{"a":-1}'
      expected: decode_reject
    - payload: '{}'
      expected: decode_reject

- id: unique-items-false-noop
  schema: UniqueItemsFalseNoOp
  note: "uniqueItems.json G3 — uniqueItems:false is a NO-OP: 1 == 1.0 duplicates and duplicate objects all ACCEPT"
  cases:
    - payload: '[1,1]'
      expected: decode_accept
    - payload: '[1,1.0]'
      expected: decode_accept
    - payload: '[{"foo":"bar"},{"foo":"bar"}]'
      expected: decode_accept
    - payload: '[1,2]'
      expected: decode_accept

- id: unique-items-deep-exact
  schema: UniqueItemsDeep
  note: "uniqueItems:true deep-equality — 1.0==1.0 duplicate; true != 1; {a:1}=={a:1.0}; key order ignored; container-depth EXACT big numbers (double would collide)"
  cases:
    - payload: '[1.0,1.0,1]'
      expected: decode_reject
    - payload: '[1,true]'
      expected: decode_accept
    - payload: '[0,false]'
      expected: decode_accept
    - payload: '[{"a":1},{"a":1.0}]'
      expected: decode_reject
    - payload: '[{"a":1,"b":2},{"b":2,"a":1}]'
      expected: decode_reject
    - payload: '[9007199254740993.0,9007199254740992.0]'
      expected: decode_accept
    - payload: '[9007199254740993.0,9007199254740993]'
      expected: decode_reject

- id: prefix-items-unique
  schema: PrefixItemsUnique
  note: "uniqueItems.json G1 — prefixItems indexed type subschemas + uniqueItems:true across ALL items"
  cases:
    - payload: '[false,true]'
      expected: decode_accept
    - payload: '[false,false]'
      expected: decode_reject
    - payload: '[false,true,"foo","bar"]'
      expected: decode_accept
    - payload: '[false,true,"foo","foo"]'
      expected: decode_reject

- id: prefix-items-items-false
  schema: PrefixItemsItemsFalse
  note: "uniqueItems.json G2 — items:false rejects any index >= prefixItems.size()"
  cases:
    - payload: '[false,true]'
      expected: decode_accept
    - payload: '[false,true,null]'
      expected: decode_reject
    - payload: '[false,false]'
      expected: decode_reject

- id: prefix-items-false
  schema: PrefixItemsFalse
  note: "uniqueItems.json G4 — prefixItems + uniqueItems:false: duplicates ACCEPT"
  cases:
    - payload: '[false,true]'
      expected: decode_accept
    - payload: '[false,false]'
      expected: decode_accept
    - payload: '[true,true]'
      expected: decode_accept
    - payload: '[false,true,"foo","foo"]'
      expected: decode_accept

- id: prefix-items-remainder
  schema: PrefixItemsItemsRemainder
  note: "prefixItems + items remainder — items applies ONLY to indices >= prefixItems.size(); prefix[0] must be boolean"
  cases:
    - payload: '[]'
      expected: decode_accept
    - payload: '[true]'
      expected: decode_accept
    - payload: '[true,1,2]'
      expected: decode_accept
    - payload: '[true,"x"]'
      expected: decode_reject
    - payload: '[1]'
      expected: decode_reject

- id: array-min-items
  schema: ArrayMinItems
  note: "minItems:2 — 1-item and empty arrays reject"
  cases:
    - payload: '[1,2]'
      expected: decode_accept
    - payload: '[1]'
      expected: decode_reject
    - payload: '[]'
      expected: decode_reject

- id: array-max-items
  schema: ArrayMaxItems
  note: "maxItems:2 — 3-item array rejects"
  cases:
    - payload: '[1,2]'
      expected: decode_accept
    - payload: '[1,2,3]'
      expected: decode_reject

- id: nested-multipleof-exact
  schema: NestedPrice
  note: "CRITICAL EXACTNESS — nested numbers with multipleOf:0.1: the raw lexeme must propagate into the container member. 0.3/0.7/0.25 are covered either way, but 10000000.7 is DISCRIMINATING: boost::json + fromDouble loses it (divmod fails -> would REJECT), only the container-depth lexeme accepts"
  cases:
    - payload: '{"price":0.3}'
      expected: decode_accept
    - payload: '{"price":0.7}'
      expected: decode_accept
    - payload: '{"price":10000000.7}'
      expected: decode_accept
    - payload: '{"price":0.25}'
      expected: decode_reject

