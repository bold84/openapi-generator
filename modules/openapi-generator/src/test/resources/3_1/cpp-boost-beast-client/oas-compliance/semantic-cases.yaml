      note: "oneOf [string, string-enum[x,y,z]] — value x matches both branches"

# =============================================================================
# Wave-1 numeric/boolean slice (SchemeEvaluator + ExactNumber + raw lexeme)
# =============================================================================
# These rows exercise the shared Wave-1 engine (ADR D1/D5, frozen IR in
# oas31_ir.hpp) through the compiled phase2_numeric_driver: it captures the raw
# JSON number LEXEME straight from the payload (before boost::json changes it),
# feeds it to ExactNumber, and evaluates via validate_<id> -> SchemaEvaluator.
# There are no Wave-0 model headers for these schema names; they are proven
# exclusively by that driver.  Baseline classification DEFERS them; the driver
# turns them into real PASS evidence (see phase2_classify.py / gate-a.sh).

- id: exact-equals-one
  schema: ExactEqualsOne
  note: "const:1 — 1 == 1.0 == 1e0 == 100e-2 (ExactNumber equality across spellings)"
  cases:
    - payload: "1"
      expected: decode_accept
    - payload: "1.0"
      expected: decode_accept
    - payload: "1e0"
      expected: decode_accept
    - payload: "100e-2"
      expected: decode_accept
    - payload: "2"
      expected: decode_reject

- id: exact-integer-type
  schema: ExactIntegerType
  note: "type:integer — classification by mathematical value, not spelling (1.0 is an integer)"
  cases:
    - payload: "1"
      expected: decode_accept
    - payload: "1.0"
      expected: decode_accept
    - payload: "-3.0"
      expected: decode_accept
    - payload: "1.5"
      expected: decode_reject

- id: mult-tenth
  schema: MulTenth
  note: "multipleOf:0.1 — exact decimal divmod (0.3/0.1 == 3, remainder 0)"
  cases:
    - payload: "0.3"
      expected: decode_accept
    - payload: "0.7"
      expected: decode_accept
    - payload: "0.25"
      expected: decode_reject

- id: mult-third
  schema: MulThird
  note: "multipleOf:0.3 — 1.0 is NOT a multiple of 0.3 (10/3 remainder 1)"
  cases:
    - payload: "0.9"
      expected: decode_accept
    - payload: "1.0"
      expected: decode_reject

- id: zero-const
  schema: ZeroConst
  note: "const:0 — negative zero is mathematically 0 (-0 == 0 == 0.0)"
  cases:
    - payload: "-0"
      expected: decode_accept
    - payload: "0"
      expected: decode_accept
    - payload: "0.0"
      expected: decode_accept
    - payload: "1"
      expected: decode_reject

- id: big-const-exact
  schema: BigConst
  note: "const:2^70 (1180591620717411303424) — beyond uint64; boost.json stores a lossy double but the lexeme keeps it exact (refuses to silently approximate)"
  cases:
    - payload: "1180591620717411303424"
      expected: decode_accept
    - payload: "1180591620717411303425"
      expected: decode_reject

- id: huge-max-exact
  schema: HugeMax
  note: "exclusiveMaximum:1e300 — very large exponent; boost.json yields inf, ExactNumber is exact"
  cases:
    - payload: "1e400"
      expected: decode_reject
    - payload: "5e299"
      expected: decode_accept

- id: tiny-min-exact
  schema: TinyMin
  note: "exclusiveMinimum:1e-300 — tiny exponent; boost.json underflows to 0, ExactNumber is exact"
  cases:
    - payload: "1e-400"
      expected: decode_reject
    - payload: "5e-200"
      expected: decode_accept

- id: nonpos-multiple-refusal
  schema: NonPosMul
  note: "multipleOf:0 — malformed schema (not > 0); evaluator REFUSES (fail closed), never a bogus verdict"
  cases:
    - payload: "5"
      expected: decode_reject
    - payload: "0"
      expected: decode_reject

- id: bool-const-true
  schema: BoolConstTrue
  note: "const:true — boolean const"
  cases:
    - payload: "true"
      expected: decode_accept
    - payload: "false"
      expected: decode_reject

- id: bool-enum-true
  schema: BoolEnumTrue
  note: "enum [true] — boolean enum"
  cases:
    - payload: "true"
      expected: decode_accept
    - payload: "false"
      expected: decode_reject
    - payload: "null"
      expected: decode_reject

- id: number-enum-spellings
  schema: NumberEnumSpellings
  note: "enum [1, 2.5] — numeric enum equality across spellings (1.0, 2.50)"
  cases:
    - payload: "1"
      expected: decode_accept
    - payload: "1.0"
      expected: decode_accept
    - payload: "2.50"
      expected: decode_accept
    - payload: "3"
      expected: decode_reject

# =============================================================================
# Wave-1 completion slice (gate-a Phase-2 driver) — boolean value-schemas
# (K-03), `not` subschema inversion (K-01), exact deep JSON const/enum equality
# across ALL kinds incl. 1 vs 1.0 (K-30/K-34), array uniqueItems with exact
# numeric equality (K-22), and local $ref resolution (K-29).  These schema names
# have NO Wave-0 model headers; they are proven exclusively by the compiled
# phase2_numeric_driver through validate_<id> -> SchemaEvaluator.  Baseline
# classification DEFERS them; driver evidence flips them to real PASS
# (see phase2_classify.py / gate-a.sh Step 4c).
# =============================================================================

- id: boolean-value-schema-true
  schema: BooleanValueTrue
  note: "K-03 OAS 3.1 boolean value-schema true — every instance is valid"
  cases:
    - payload: "true"
      expected: decode_accept
    - payload: "false"
      expected: decode_accept
    - payload: "42"
      expected: decode_accept
    - payload: '"hello"'
      expected: decode_accept
    - payload: "null"
      expected: decode_accept

- id: boolean-value-schema-false
  schema: BooleanValueFalse
  note: "K-03 OAS 3.1 boolean value-schema false — no instance is valid (reject)"
  cases:
    - payload: "true"
      expected: decode_reject
    - payload: "false"
      expected: decode_reject
    - payload: "42"
      expected: decode_reject
    - payload: "null"
      expected: decode_reject

- id: not-const-zero
  schema: NotConstZero
  note: "K-01 { not: { const: 0 } } — 0 is negated-rejected, any other value accepted"
  cases:
    - payload: "0"
      expected: decode_reject
    - payload: "1"
      expected: decode_accept
    - payload: "-3"
      expected: decode_accept
    - payload: '"x"'
      expected: decode_accept

- id: not-type-string
  schema: NotTypeString
  note: "K-01 { not: { type: string } } — strings negated-rejected, non-strings accepted"
  cases:
    - payload: '"hi"'
      expected: decode_reject
    - payload: "42"
      expected: decode_accept
    - payload: "true"
      expected: decode_accept

- id: deep-const-object
  schema: DeepConstObject
  note: "K-30 const:{a:1,b:[true,null]} — exact deep equality over object/array; a=1.0 == a=1"
  cases:
    - payload: '{"a":1,"b":[true,null]}'
      expected: decode_accept
    - payload: '{"a":1.0,"b":[true,null]}'
      expected: decode_accept
    - payload: '{"a":2,"b":[true,null]}'
      expected: decode_reject
    - payload: '{"a":1}'
      expected: decode_reject

- id: deep-const-array
  schema: DeepConstArray
  note: "K-30 const:[1,2,3] — exact deep equality over array; 1.0 == 1 member"
  cases:
    - payload: '[1,2,3]'
      expected: decode_accept
    - payload: '[1.0,2,3]'
      expected: decode_accept
    - payload: '[1,2,4]'
      expected: decode_reject

- id: deep-enum-objects
  schema: DeepEnumObjects
  note: "K-34 enum:[{a:1},{b:x}] — exact deep equality over object-values; a=1.0 == a=1"
  cases:
    - payload: '{"a":1}'
      expected: decode_accept
    - payload: '{"a":1.0}'
      expected: decode_accept
    - payload: '{"c":9}'
      expected: decode_reject

- id: unique-items-exact-number
  schema: UniqueItemsMixed
  note: "K-22 uniqueItems:true over array — 1 == 1.0 is a duplicate (ExactNumber)"
  cases:
    - payload: '[1,2]'
      expected: decode_accept
    - payload: '[1,2,3]'
      expected: decode_accept
    - payload: '[1,1.0]'
      expected: decode_reject
    - payload: '[1,2,1.0]'
      expected: decode_reject

- id: ref-const-five
  schema: RefConstFive
  note: "K-29 local $ref -> const:5 node — resolves target transparently (5 accept, 6 reject)"
  cases:
    - payload: "5"
      expected: decode_accept
    - payload: "6"
      expected: decode_reject
    - payload: "5.0"
      expected: decode_accept

