openapi: 3.0.3
info:
  title: Cpp Boost Beast response union duplicate types
  version: 1.0.0
  description: >
    OAS 3.0 response union regression with duplicate C++ body types.
    Both 200 and 201 return the same FullResource model, requiring
    StatusTaggedValue wrappers to preserve distinct status identity.
paths:
  /duplicate-types:
    post:
      operationId: postDuplicateTypes
      summary: Return same shape with different status codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '200':
          description: Standard success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullResource'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullResource'
components:
  schemas:
    CreateRequest:
      type: object
      properties:
        name:
          type: string
    FullResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: integer
          format: int32
